name: ci

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag for bundle naming"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew clean build

      - name: Test
        run: ./gradlew test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-reports
          path: |
            **/build/test-results/**/*.xml
            **/build/reports/tests/**

      - name: Dependency Vulnerability Scan (placeholder)
        run: |
          echo "Integrate SCA scanner (e.g., Dependabot, Snyk, or OWASP Dependency-Check)"
          echo "Fail build on critical vulnerabilities unless approved exception exists"

      - name: Secret Scan (placeholder)
        run: |
          echo "Integrate secret scanning (e.g., gitleaks)"

      - name: IaC Lint/Validate
        run: |
          cd infra/terraform
          terraform fmt -check -recursive

  package-bundle:
    runs-on: ubuntu-latest
    needs: build-test-scan
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Deployment Bundle
        run: |
          mkdir -p dist
          cp DEPLOYMENT_SPEC_PHASE4.md dist/
          cp -r infra dist/infra
          cp -r deployment dist/deployment

      - name: Upload Deployment Bundle
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: dist/
